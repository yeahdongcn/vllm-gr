[build-system]
requires = [
    "packaging>=24.2",
    "setuptools>=77.0.3,<81.0.0",
    "wheel",
    # 8.0.0 generates invalid Python in _version.py; 8.0.4 is the tested floor.
    "setuptools-scm>=8.0.4",
]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-gr"
dynamic = ["version", "dependencies"]
description = "vLLM-based Generative Recommender Inference Engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.14"
authors = [
    {name = "vllm-gr Authors"},
]
keywords = ["machine-learning", "recommender-systems", "inference", "vllm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Platform runtimes are selected automatically via setup.py + requirements/.
# See README.md for platform installation instructions.

[project.optional-dependencies]
# Experimental gRPC entrypoint (`vllm serve MODEL --gr --grpc`). The smg-* packages come
# from https://github.com/lightseekorg/smg and are Apache-2.0 licensed; the
# extended .proto copies and their generated bindings live under
# vllm_gr/entrypoints/grpc/ (see generated/README.md).
grpc = [
    "grpcio>=1.84.0,<2",
    "protobuf>=7.35.1,<8",
    "smg-grpc-proto==0.4.6",
    "smg-grpc-servicer==0.5.2",
]
dev = [
    "packaging>=24.2",
    # Packaging tests import setup.py and build distributions without build isolation.
    "pip",
    "setuptools>=77.0.3,<81.0.0",
    "setuptools-scm>=8.0.4",
    "wheel",
    "pytest>=7.0.0",
    "pytest-xdist",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout",
    "pytest-cov>=4.0.0",
    "types-protobuf",
    "tblib",
    "ruff",
    # Match the isolated pre-commit hooks and the subprocess contract tests.
    "mypy==1.11.1",
    "psutil",
    "PyYAML>=6.0",
    # Regenerates vllm_gr/entrypoints/grpc/generated/. Pinned: the bundled protoc
    # version is written into the output, so another release yields a diff.
    "grpcio-tools==1.84.0",
]
# DEPRECATED: use `pip install -e .` — platform deps come from setup.py
# Kept for one transition release so legacy `.[gpu]` installs still receive
# the GPU-only GR dependencies even if setup.py metadata routing is bypassed.
gpu = [
]
# DEPRECATED: use `pip install -e .` — platform deps come from setup.py
npu = []

[project.urls]
Homepage = "https://github.com/JiusiServe/vllm-gr"
Documentation = "https://github.com/JiusiServe/vllm-gr#readme"
Repository = "https://github.com/JiusiServe/vllm-gr.git"
Issues = "https://github.com/JiusiServe/vllm-gr/issues"

[project.entry-points."vllm.general_plugins"]
vllm_gr = "vllm_gr.plugin:register"

[project.entry-points."vllm_gr.platform_backends"]
cuda = "vllm_gr.platforms.cuda.provider:CUDA_BACKEND"
ascend = "vllm_gr.platforms.ascend.provider:NPU_BACKEND"
musa = "vllm_gr.platforms.musa.provider:MUSA_BACKEND"

# Historical v1 entry points identify tensor placement instead of the provider.
[project.entry-points."vllm_gr.legacy_placements"]
cuda = "vllm_gr.platforms.cuda.provider:CUDA_BACKEND"
npu = "vllm_gr.platforms.ascend.provider:NPU_BACKEND"

[project.scripts]
vllm-gr-sidecar = "vllm_gr.sidecar.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_gr*"]

[tool.setuptools.package-data]
"vllm_gr" = ["_version.py", "*.json"]
"vllm_gr.config" = ["default_config.yaml"]
"vllm_gr.entrypoints.grpc" = ["proto/*.proto"]
"vllm_gr.entrypoints.grpc.generated" = ["README.md"]
"vllm_gr.platforms.musa" = ["README.md"]

[tool.setuptools_scm]
# setup.py owns version selection and device suffixes.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
# Default guard; the long system tests carry their own @pytest.mark.timeout.
timeout = 250
# Mirrors the upstream vLLM convention: markers describe which execution
# environment a test belongs to. They are descriptive, so CI selects with
# `-m` rather than the framework skipping on hardware availability.
markers = [
    "slow: mark test as slow to run; skipped unless --run-slow is given",
    "slow_test: alias of slow, kept for upstream naming consistency",
    "cpu_test: mark test as CPU-only test",
    "gpu_test: mark test as requiring a CUDA device",
    "npu_test: mark test as requiring an Ascend NPU runtime",
    "model_test: mark test as requiring model weights",
    "network: mark test as requiring network access",
    # Also registered by tests/level_plugin.py. Listed here so entry points that
    # skip tests/conftest.py (--confcutdir) still pass --strict-markers.
    "l1: vllm-gr L1 CI test level",
    "l2: vllm-gr L2 CI test level",
    "l3: vllm-gr L3 CI test level",
    "l4: vllm-gr L4 CI test level",
    "l5: vllm-gr L5 CI test level",
]

[tool.ruff]
extend-exclude = ["vllm_gr/entrypoints/grpc/generated"]
line-length = 100
target-version = "py311"

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "vllm_gr.entrypoints.grpc.generated.*"
follow_imports = "skip"

[tool.typos.default.extend-identifiers]
image_grid_thw = "image_grid_thw"
_get_cumsum_and_arange = "_get_cumsum_and_arange"
CANN = "CANN"
arange_np = "arange_np"
cann = "cann"
fx_arange = "fx_arange"

[tool.typos.default.extend-words]
nd = "nd"
